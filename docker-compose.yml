services:
  planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptuk-academic-planner
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    shm_size: "1gb"
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,nosuid,size=512m"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - ptuk_sqlite_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3001/api/health/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ptuk_sqlite_data:
